name: "Build Docker Image"

on:
  push:
    branches:
      - main
  workflow_dispatch: # Pemicu manual dari web GitHub

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: "Build and Push Image to GHCR"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Setup QEMU untuk build multi-platform jika dibutuhkan di kemudian hari
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Setup Docker Buildx untuk fitur caching tingkat lanjut
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Caching layer docker menggunakan Github Actions Cache (gha)
          cache-from: type=gha
          cache-to: type=gha,mode=max