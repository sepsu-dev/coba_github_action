name: "deploy"

on:
  workflow_dispatch: # Tetap bisa diklik manual penuh dari nol
  workflow_run:
    workflows: ["1 🚀 Pipeline: Build Docker Image"] # Memantau file build
    types:
      - completed # Terpancing jalan saat file build selesai

jobs:
  deploy:
    name: "SSH Deploy to Ubuntu 24"
    if: ${{ github.event.workflow_run == null || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    
    # TAMBAHKAN DUA BARIS INI UNTUK MENGAKTIFKAN SISTEM APPROVAL
    environment:
      name: production

    steps:
      - name: Executing Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            mkdir -p /var/www/my-bun-app
            cd /var/www/my-bun-app

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/${{ github.repository }}:latest
            docker stop my-bun-container || true
            docker rm my-bun-container || true

            if [ -f ".env" ]; then
              ENV_FLAG="--env-file .env"
            else
              ENV_FLAG=""
            fi

            docker run -d \
              --name my-bun-container \
              --restart always \
              -p 3000:3000 \
              $ENV_FLAG \
              ghcr.io/${{ github.repository }}:latest

            docker image prune -f