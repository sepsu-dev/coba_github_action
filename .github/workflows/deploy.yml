name: "Deploy Application"

on:
  workflow_run:
    workflows: ["Build Docker Image"]
    types:
      - completed
  workflow_dispatch: # Pemicu manual dari tab Actions GitHub

jobs:
  deploy:
    name: "Deploy to VPS via SSH"
    # Berjalan jika dipicu manual ATAU dari workflow_run yang sukses
    if: ${{ github.event.workflow_run == null || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Executing Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            # Mengautentikasi Docker ke GHCR di dalam VPS menggunakan token GitHub runner saat ini
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Mengunduh image terbaru yang berhasil di-push
            docker pull ghcr.io/${{ github.repository }}:latest

            # Menghentikan kontainer yang sedang berjalan
            docker stop my-bun-container || true
            docker rm my-bun-container || true

            # Menjalankan kontainer baru
            docker run -d \
              --name my-bun-container \
              --restart always \
              -p 3000:3000 \
              ghcr.io/${{ github.repository }}:latest

            # Membersihkan sisa image yang tidak digunakan untuk membebaskan ruang disk VPS
            docker image prune -f
